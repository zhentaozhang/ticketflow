# Grafana datasource provisioning（observability-as-code）
# Loki：日志检索；Jaeger：链路追踪（与 Loki 的 traceId 派生字段联动）。
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # 从日志中的 traceId= 派生跳转到 Jaeger 的链接（浏览器打开，故用 localhost）
      derivedFields:
        - name: TraceID
          matcherRegex: "traceId[=:]\\s*([0-9a-f]{16,32})"
          url: "http://localhost:16686/trace/$${__value.raw}"
          datasourceUid: jaeger

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
