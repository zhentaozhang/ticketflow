# =============================================================================
# Loki 单机配置（本地开发用，文件存储，无鉴权）
# 接收 Promtail 推送的应用日志，供 Grafana 检索（与 Prometheus 指标、Jaeger 链路并列）。
# =============================================================================
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: false
  reject_old_samples: false

ruler:
  alertmanager_url: http://alertmanager:9093
