# =============================================================================
# OpenTelemetry Java Agent Declarative Configuration
#
# 目的：把 Prometheus 每 15s 抓取 /actuator/prometheus、健康检查 /actuator/health
#       等产生的 SERVER span 直接 DROP，消除 trace 噪音；业务请求不受影响。
#
# 重要（坑）：declarative config 一旦提供，会整体接管 SDK 的资源配置——
# 环境变量 OTEL_EXPORTER_OTLP_ENDPOINT / OTEL_SERVICE_NAME / OTEL_RESOURCE_ATTRIBUTES
# 不再自动生效，因此这里必须显式声明 resource（经 env 引用）与 trace exporter。
# 参考官方示例：open-telemetry/opentelemetry-java-examples/javaagent-declarative-configuration
# =============================================================================
file_format: "1.0"

resource:
  # 从 OTEL_RESOURCE_ATTRIBUTES 环境变量读取附加资源属性
  attributes_list: ${OTEL_RESOURCE_ATTRIBUTES}
  detection/development:
    detectors:
      - service:   # service.name 取 OTEL_SERVICE_NAME 环境变量（Jaeger 服务名依赖它）
      - host:
      - process:
      - container:

propagator:
  composite:
    - tracecontext:
    - baggage:

tracer_provider:
  processors:
    - batch:
        exporter:
          otlp_http:
            # 沿用 compose 的 OTEL_EXPORTER_OTLP_ENDPOINT（http://jaeger:4318）
            endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}/v1/traces

  # rule_based_routing 采样器（v2.31 已内置）：DROP 匹配的 SERVER span，其余 always_on
  sampler:
    rule_based_routing:
      fallback_sampler:
        always_on:
      span_kind: SERVER
      rules:
        # 丢弃所有 /actuator/* 的入口 SERVER span（含其子 span）
        - action: DROP
          attribute: url.path
          pattern: /actuator.*
