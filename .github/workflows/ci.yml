name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B test

  integration-tests:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run integration tests
        run: mvn -B verify -pl ticketflow-server/ticketflow-order-service,ticketflow-server/ticketflow-program-service -am

  docker-images:
    name: Build application images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 只构建镜像、不启动容器；顺带验证 Dockerfile / build.sh / fat-jar 容器化链路可跑通
      - name: Build image only (no up)
        run: bash ./docker/build.sh images

  frontend-vue3:
    name: Frontend build (vue3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: vue3/pnpm-lock.yaml

      - name: Install & build
        working-directory: vue3
        run: pnpm install --frozen-lockfile && pnpm run build

  frontend-admin:
    name: Frontend build (admin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: ticketflow-front-manage/pnpm-lock.yaml

      - name: Install & build admin app
        working-directory: ticketflow-front-manage
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm install --frozen-lockfile && pnpm run build:ele

  static-analysis:
    name: Static analysis (Checkstyle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 强制门禁：命中即失败
      - name: Checkstyle
        run: mvn -B checkstyle:check

      # 强制门禁（High 阈值）；豁免项见 config/spotbugs/exclude.xml
      - name: SpotBugs
        run: mvn -B -DskipTests compile spotbugs:check
