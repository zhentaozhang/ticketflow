name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B test

  integration-tests:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run integration tests
        run: mvn -B verify -pl ticketflow-server/ticketflow-order-service,ticketflow-server/ticketflow-program-service -am

  coupon-seckill:
    name: coupon-seckill tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run coupon-seckill tests
        run: mvn -B -f coupon-seckill/pom.xml test

  docker-images:
    name: Build application images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 只构建镜像、不启动容器；顺带验证 Dockerfile / build.sh / patch-jar 链路可跑通
      - name: Build image only (no up)
        run: bash ./docker/build.sh images

  frontend-vue3:
    name: Frontend build (vue3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vue3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vue3/package-lock.json

      - name: Install & build
        run: npm install --legacy-peer-deps && npm run build

  frontend-admin:
    name: Frontend build (admin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ticketflow-front-manage
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: ticketflow-front-manage/pnpm-lock.yaml

      - name: Install & build admin app
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm install --frozen-lockfile && pnpm run build:ele
