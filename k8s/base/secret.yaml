# 敏感配置模板（占位，禁止提交真实值）。
# 生产落地建议：
#   * 用 SealedSecrets / External Secrets / Vault 注入，而非明文 Secret；
#   * 或通过 CI 在部署时用 `kubectl create secret ... --dry-run=client -o yaml | kubectl apply -f -` 生成。
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  JASYPT_ENCRYPTOR_PASSWORD: "REPLACE_ME"
  # Redis 认证口令（须与 Redis 服务端 requirepass 一致）
  SPRING_DATA_REDIS_PASSWORD: "REPLACE_ME"
  # 登录会话 HMAC 签名密钥（网关与 user-service 必须一致，不可与 Redis 口令复用）
  SESSION_SIGN_SECRET: "REPLACE_ME"
  # 内部接口令牌（保护 base-data 的渠道私钥接口；网关/user-service/base-data 必须一致）
  INTERNAL_TOKEN: "REPLACE_ME"
  # 支付渠道密钥等（原 docker/app/pay.env）
  ALIPAY_APP_ID: "REPLACE_ME"
  ALIPAY_PRIVATE_KEY: "REPLACE_ME"
