spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/coupon_seckill_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}

coupon-seckill:
  mock-messaging: true

logging:
  level:
    com.couponseckill: info
