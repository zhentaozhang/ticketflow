rules:
  - !SHARDING
    tables:
      d_program:
        actualDataNodes: ds_$->{0..1}.d_program_$->{0..1}
        databaseStrategy:
          complex:
            shardingColumns: id
            shardingAlgorithmName: database-program-complex
        tableStrategy:
          complex:
            shardingColumns: id
            shardingAlgorithmName: table-program-complex
      d_program_group:
        actualDataNodes: ds_$->{0..1}.d_program_group_$->{0..1}
        databaseStrategy:
          complex:
            shardingColumns: id
            shardingAlgorithmName: database-program-complex
        tableStrategy:
          complex:
            shardingColumns: id
            shardingAlgorithmName: table-program-complex
      d_program_show_time:
        actualDataNodes: ds_$->{0..1}.d_program_show_time_$->{0..1}
        databaseStrategy:
          complex:
            shardingColumns: program_id
            shardingAlgorithmName: database-program-complex
        tableStrategy:
          complex:
            shardingColumns: program_id
            shardingAlgorithmName: table-program-complex
      d_seat:
        actualDataNodes: ds_$->{0..1}.d_seat_$->{0..1}
        databaseStrategy:
          complex:
            shardingColumns: program_id
            shardingAlgorithmName: database-program-complex
        tableStrategy:
          complex:
            shardingColumns: program_id
            shardingAlgorithmName: table-program-complex
      d_ticket_category:
        actualDataNodes: ds_$->{0..1}.d_ticket_category_$->{0..1}
        databaseStrategy:
          complex:
            shardingColumns: program_id
            shardingAlgorithmName: database-program-complex
        tableStrategy:
          complex:
            shardingColumns: program_id
            shardingAlgorithmName: table-program-complex
      d_program_record_task:
        actualDataNodes: ds_$->{0..1}.d_program_record_task_$->{0..1}
        databaseStrategy:
          complex:
            shardingColumns: program_id
            shardingAlgorithmName: database-program-complex
        tableStrategy:
          complex:
            shardingColumns: program_id
            shardingAlgorithmName: table-program-complex
    broadcastTables:
      - undo_log
      - d_program_category
    shardingAlgorithms:
      database-program-complex:
        type: CLASS_BASED
        props:
          strategy: complex
          algorithmClassName: com.ticketflow.shardingsphere.DatabaseOrderComplexGeneArithmetic
          sharding-count: 2
          table-sharding-count: 2
      table-program-complex:
        type: CLASS_BASED
