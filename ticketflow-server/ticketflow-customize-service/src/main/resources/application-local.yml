spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ticketflow_customize?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER_CUSTOMIZE:-root}
    password: ${MYSQL_PASSWORD_CUSTOMIZE:-root}
    hikari:
      max-lifetime: 60000