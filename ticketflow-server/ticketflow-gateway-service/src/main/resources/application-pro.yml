spring:
  cloud:
    gateway:
      enabled: true
      discovery:
        locator:
          # 关闭按服务名自动路由，避免绕过下面显式配置的 StripPrefix 路由把全部服务暴露出去
          enabled: false
      routes:
        - id: ${prefix.distinction.name:ticketflow}-base-data-service
          uri: lb://${prefix.distinction.name:ticketflow}-base-data-service
          predicates:
            - Path=/ticketflow/basedata/**
          filters:
            - StripPrefix=2
          metadata:
            title: 基础数据服务

        - id: ${prefix.distinction.name:ticketflow}-customize-service
          uri: lb://${prefix.distinction.name:ticketflow}-customize-service
          predicates:
            - Path=/ticketflow/customize/**
          filters:
            - StripPrefix=2
          metadata:
            title: 定制化服务

        - id: ${prefix.distinction.name:ticketflow}-job-service
          uri: lb://${prefix.distinction.name:ticketflow}-job-service
          predicates:
            - Path=/ticketflow/job/**
          filters:
            - StripPrefix=2
          metadata:
            title: 任务执行服务

        - id: ${prefix.distinction.name:ticketflow}-order-service
          uri: lb://${prefix.distinction.name:ticketflow}-order-service
          predicates:
            - Path=/ticketflow/order/**
          filters:
            - StripPrefix=2
          metadata:
            title: 订单服务

        - id: ${prefix.distinction.name:ticketflow}-coupon-service
          uri: lb://${prefix.distinction.name:ticketflow}-coupon-service
          predicates:
            - Path=/ticketflow/coupon/**
          filters:
            - StripPrefix=2
          metadata:
            title: 优惠券服务
            
        - id: ${prefix.distinction.name:ticketflow}-migrate-service
          uri: lb://${prefix.distinction.name:ticketflow}-migrate-service
          predicates:
            - Path=/ticketflow/migrate/**
          filters:
            - StripPrefix=2
          metadata:
            title: 迁移服务    

        - id: ${prefix.distinction.name:ticketflow}-pay-service
          uri: lb://${prefix.distinction.name:ticketflow}-pay-service
          predicates:
            - Path=/ticketflow/pay/**
          filters:
            - StripPrefix=2
          metadata:
            title: 支付服务

        - id: ${prefix.distinction.name:ticketflow}-program-service
          uri: lb://${prefix.distinction.name:ticketflow}-program-service
          predicates:
            - Path=/ticketflow/program/**
          filters:
            - StripPrefix=2
          metadata:
            title: 节目服务

        - id: ${prefix.distinction.name:ticketflow}-user-service
          uri: lb://${prefix.distinction.name:ticketflow}-user-service
          predicates:
            - Path=/ticketflow/user/**
          filters:
            - StripPrefix=2
          metadata:
            title: 用户服务
            
        - id: ${prefix.distinction.name:ticketflow}-admin-service
          uri: lb://${prefix.distinction.name:ticketflow}-admin-service
          predicates:
            - Path=/ticketflow/admin/**
          filters:
            - StripPrefix=2
          metadata:
            title: 监听服务

# 生产/容器：关闭"非签名普通访问"。
# 否则任意客户端只要带请求头 no_verify=true 即可跳过 RSA 验签与 token 校验。
# 需要放行非签名访问（如内网管理端）时显式置 true，或用环境变量 ALLOW_NORMAL_ACCESS=true 覆盖。
allow:
  normal:
    access: false