#服务端口
server:
  port: 10082
# 应用名称
spring:
  application:
    name: ${prefix.distinction.name:ticketflow}-admin-service
  boot:
    admin:
      ui:
        title: 服务监控中心
        brand: <span>服务监控中心</span>
  # nacos
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  security:
    user:
      name: ${ADMIN_USER_NAME:admin}
      password: ${ADMIN_USER_PASSWORD:admin}    
#钉钉机器人告警配置（可选）：
#  token 为钉钉机器人完整 webhook URL，如 https://oapi.dingtalk.com/robot/send?access_token=xxx
#  留空（默认）则不发送告警
#dingtalk:
#  token:
  main:
    allow-bean-definition-overriding: true
management:
  metrics:
    tags:
      application: admin-service
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: '*'
  health:
    elasticsearch:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
    
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
#knife4j配置
knife4j:
  #是否启用增强设置
  enable: true
  #开启生产环境屏蔽
  production: ${KNIFE4J_PRODUCTION:false}
  #是否启用登录认证
  basic:
    enable: false
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true    
